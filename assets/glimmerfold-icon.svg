<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Glimmerfold">
  <title>Glimmerfold</title>
  <defs>
    <linearGradient id="gf-foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset=".28" stop-color="#e6c36f"/>
      <stop offset=".55" stop-color="#9c7425"/>
      <stop offset=".78" stop-color="#f3d98b"/>
      <stop offset="1" stop-color="#b8913f"/>
    </linearGradient>
    <linearGradient id="gf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2521"/>
      <stop offset="1" stop-color="#121010"/>
    </linearGradient>
    <linearGradient id="gf-page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8dcc4"/>
      <stop offset=".25" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#f3ead8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#gf-bg)"/>
  <!-- the inside page of the card -->
  <path d="M27 14.5h17.5a3.5 3.5 0 0 1 3.5 3.5v28a3.5 3.5 0 0 1-3.5 3.5H27z" fill="url(#gf-page)"/>
  <!-- the gold-foil cover, swinging open toward you -->
  <path d="M27 14.5 15.1 18.9a2.4 2.4 0 0 0-1.6 2.3v29.6a2.4 2.4 0 0 0 3.1 2.3L27 49.5z" fill="url(#gf-foil)"/>
  <path d="M27 14.5 15.1 18.9a2.4 2.4 0 0 0-1.6 2.3v29.6a2.4 2.4 0 0 0 3.1 2.3L27 49.5z" fill="none" stroke="#fff6d8" stroke-opacity=".5" stroke-width=".7"/>
  <!-- the glimmer inside -->
  <path d="M37.6 21.5c.7 6.6 2.9 9.3 8.4 10.5-5.5 1.2-7.7 3.9-8.4 10.5-.7-6.6-2.9-9.3-8.4-10.5 5.5-1.2 7.7-3.9 8.4-10.5z" fill="url(#gf-foil)"/>
  <circle cx="44.2" cy="22.6" r="1.5" fill="#f3d98b"/>
  <circle cx="31.4" cy="42.6" r="1.1" fill="#e6c36f"/>
</svg>
